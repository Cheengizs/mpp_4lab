<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Захват территории</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161c; color: #eee; display: flex; justify-content: center; padding-top: 15vh; }
  form { display: flex; flex-direction: column; gap: 1rem; width: 300px; }
  input, button { padding: .6rem; font-size: 1rem; border-radius: 6px; border: 0; }
  button { background: #3b82f6; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<form action="/create" method="get">
  <h2>Захват территории</h2>
  <label>Количество игроков в комнате (2–10)
    <input type="number" name="n" min="2" max="10" value="4">
  </label>
  <button>Создать комнату</button>
</form>
</body>
</html>
