<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WS Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; height: 360px; overflow-y: auto; padding: .5rem; border-radius: 6px; }
  .sys { color: #888; font-style: italic; }
  form { display: flex; gap: .5rem; margin-top: .5rem; }
  input[type=text] { flex: 1; padding: .5rem; }
  #status { font-size: .9rem; }
</style>
</head>
<body>
<h2>WebSocket чат</h2>
<p>Адрес комнаты: <a id="link"></a> <span id="status">connecting…</span></p>
<div id="log"></div>
<form id="form">
  <input type="text" id="text" placeholder="Сообщение" autocomplete="off" autofocus>
  <button>Отправить</button>
</form>
<script>
  const roomId = location.pathname.split('/').pop();
  const link = document.getElementById('link');
  link.href = link.textContent = location.href;
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  let ws, me = '';

  function add(text, cls) {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(roomId)}`);
    ws.onopen = () => status.textContent = 'online';
    ws.onclose = () => { status.textContent = 'reconnecting…'; setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'welcome') { me = m.name; add(`Вы: ${me}`, 'sys'); }
      else if (m.type === 'system') { add(m.text, 'sys'); status.textContent = `online: ${m.online}`; }
      else add(`[${new Date(m.time).toLocaleTimeString()}] ${m.name}${m.name === me ? ' (вы)' : ''}: ${m.text}`);
    };
  }
  connect();

  document.getElementById('form').onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById('text');
    if (input.value.trim() && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ text: input.value }));
      input.value = '';
    }
  };
</script>
</body>
</html>
