services:
  - type: web
    name: capture-all
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: capture-all-db
          property: connectionString

databases:
  - name: capture-all-db
    plan: free
